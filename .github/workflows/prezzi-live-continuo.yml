# prezzi-live-continuo.yml - v7.24 PREZZI INTRADAY (cot_radar/live.py, EODHD real-time, ritardo ~15 min) in CICLO.
# PERCHE': il vecchio prezzi-live.yml partiva "ogni 15 minuti", ma GitHub avvia di rado le corse cosi' frequenti
# (in mesi: 4 giri in tutto). Ora 4 partenze al giorno; ognuna resta accesa fino a ~5h45 e ogni 15 minuti, SE una
# borsa e' aperta (Europa, USA/Canada, Sydney: live.ORARI), scarica i prezzi e riscrive il ramo "live" (un solo
# commit, sovrascritto). Anche se GitHub parte in ritardo, il ciclo copre comunque la seduta.
# Una partenza nuova sostituisce quella vecchia (concurrency): mai due cicli insieme.
# Chiamate EODHD: ~1 per simbolo a giro, ~64 giri al giorno (dentro il limite del piano). Chiave solo dai Secrets.
# v9.53 STAFFETTA (causa dei prezzi fermi del 25 e 26/11): GitHub avvia le partenze programmate con ore di ritardo
# (il 26/11 quelle di giorno sono partite tra le 17 e le 05 UTC) e ogni partenza nuova SPEGNEVA il ciclo acceso.
# Ora: 1) 10 minuti prima della fine il ciclo avvia da solo il giro successivo, se una borsa e' aperta o apre entro
#      6,5 ore (live.py --staffetta): copertura continua senza dipendere dagli orari di GitHub;
#      2) cancel-in-progress: false = una partenza nuova ASPETTA che finisca quella accesa (non la spegne piu');
#      3) le partenze programmate restano come riserva se la staffetta si interrompe; la sorveglianza, se i prezzi
#         restano fermi, spegne il ciclo bloccato e ne avvia uno nuovo (sorveglianza.ripara).
name: Prezzi live continuo
on:
  schedule:
    - cron: "41 6 * * 1-5"     # Europa (apre alle 07/08 UTC)
    - cron: "41 12 * * 1-5"    # meta' giornata + apertura USA
    - cron: "11 9 * * 1-5"     # v9.13 riserva: il 24/11 GitHub non ha avviato il giro delle 12:41 (prezzi fermi 6 ore)
    - cron: "11 15 * * 1-5"    # v9.13 riserva (una partenza nuova sostituisce quella in corso: nessun doppione)
    - cron: "41 18 * * 1-5"    # chiusura USA
    - cron: "41 22 * * 0-4"    # Sydney (notte italiana)
  workflow_dispatch:
permissions:
  contents: write
  actions: write          # v9.53 per avviare il giro successivo (staffetta)
concurrency:
  group: prezzi-live-continuo
  cancel-in-progress: false   # v9.53 la partenza nuova aspetta, non spegne il ciclo acceso
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Ciclo dei prezzi intraday
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          FINE=$(( $(date +%s) + 345*60 ))
          STAFFETTA=$(( FINE - 10*60 ))   # v9.53 da qui in poi si avvia il giro successivo (una volta sola)
          PASSATA=0
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while [ "$(date +%s)" -lt "$FINE" ]; do
            if python3 -m cot_radar.live --aperta; then
              rm -rf out prima.json
              # live.json del giro prima (solo per riusare i simboli gia' trovati: meno richieste)
              curl -sf -m 20 -o prima.json "https://raw.githubusercontent.com/${{ github.repository }}/live/live.json" || true
              if python3 -m cot_radar.live out prima.json; then
                ( cd out && git init -q -b live && git add -A && git commit -qm "prezzi live: $(date -u +%F' '%H:%M)" \
                  && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live:live ) \
                  || echo "push non riuscito: riprovo al giro dopo"
              fi
            else
              echo "$(date -u +%H:%M) borse chiuse"
            fi
            # v9.53 STAFFETTA: il giro successivo parte adesso e resta in attesa finche' questo non finisce
            if [ "$PASSATA" = 0 ] && [ "$(date +%s)" -ge "$STAFFETTA" ]; then
              PASSATA=1
              if python3 -m cot_radar.live --staffetta; then
                curl -sf -m 30 -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/workflows/prezzi-live-continuo.yml/dispatches" \
                  -d '{"ref":"main"}' && echo "$(date -u +%H:%M) staffetta: giro successivo avviato" || echo "staffetta non riuscita: restano le partenze programmate"
              else
                echo "$(date -u +%H:%M) nessuna borsa aperta nelle prossime ore: niente staffetta"
              fi
            fi
            ADESSO=$(date +%s)
            [ "$ADESSO" -ge "$FINE" ] && break
            ATTESA=900
            # l'ultima pausa si accorcia: il ciclo finisce puntuale e il giro successivo parte subito
            [ $(( FINE - ADESSO )) -lt 900 ] && ATTESA=$(( FINE - ADESSO ))
            # se la staffetta deve ancora partire, ci si sveglia in tempo per avviarla
            [ "$PASSATA" = 0 ] && [ "$ADESSO" -lt "$STAFFETTA" ] && [ $(( STAFFETTA - ADESSO )) -lt "$ATTESA" ] && ATTESA=$(( STAFFETTA - ADESSO ))
            sleep "$ATTESA"
          done
